services:
  - type: web
    name: java-mastery-backend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./java-mastery/backend/Dockerfile
    dockerContext: ./java-mastery/backend
    envVars:
      - key: ANTHROPIC_API_KEY
        scope: build,runtime
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        scope: runtime
        value: http://localhost:5173
