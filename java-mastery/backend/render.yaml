services:
  - type: web
    name: java-mastery-backend
    env: java
    region: oregon
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: ANTHROPIC_API_KEY
        scope: build,runtime
        sync: false
